<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>Snake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b14'/%3E%3Cpath d='M7 22h10V12h8' fill='none' stroke='%234ade80' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='24' r='3' fill='%23fb7185'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-state="menu">
  <main class="app">
    <header class="hud">
      <h1 class="logo">SNAKE</h1>

      <div class="stats">
        <div class="stat">
          <span class="label">Score</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stat" id="bestStat">
          <span class="label">Best · <span id="diffTag">Normal</span></span>
          <span class="value" id="best">0</span>
        </div>
      </div>

      <div class="hud-buttons">
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause (Space)" title="Pause (Space)" disabled>
          <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </button>
        <button class="icon-btn" id="muteBtn" type="button" aria-label="Mute (M)" title="Mute (M)">
          <svg class="icon icon-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.7a1 1 0 0 0 1.6-.8V5.6a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1z"/><path class="stroke" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="icon icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5a1 1 0 0 0 1 1h3l4.4 3.7a1 1 0 0 0 1.6-.8V5.6a1 1 0 0 0-1.6-.8L8 8.5H5a1 1 0 0 0-1 1z"/><path class="stroke" d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
        </button>
      </div>
    </header>

    <div class="board" id="board">
      <canvas id="canvas" aria-label="Snake game board" role="img"></canvas>

      <!-- Start / menu -->
      <section class="overlay show" id="menuOverlay" aria-labelledby="menuTitle">
        <div class="card">
          <h2 class="title" id="menuTitle">Snake</h2>
          <p class="subtitle">Eat. Grow. Don't bite yourself.</p>

          <fieldset class="difficulty">
            <legend>Difficulty</legend>
            <div class="segmented">
              <label><input type="radio" name="difficulty" value="easy" /><span>Easy<small>1</small></span></label>
              <label><input type="radio" name="difficulty" value="normal" /><span>Normal<small>2</small></span></label>
              <label><input type="radio" name="difficulty" value="hard" /><span>Hard<small>3</small></span></label>
              <label><input type="radio" name="difficulty" value="insane" /><span>Insane<small>4</small></span></label>
            </div>
            <p class="diff-desc" id="diffDesc"></p>
          </fieldset>

          <p class="menu-best">High score <strong id="menuBest">0</strong></p>

          <label class="option"><input type="checkbox" id="colorblindMenu" /><span>Red–green colorblind mode</span></label>

          <button class="btn primary" id="playBtn" type="button" data-autofocus>Play <kbd>Enter</kbd></button>
        </div>
      </section>

      <!-- Pause -->
      <section class="overlay" id="pauseOverlay" aria-labelledby="pauseTitle" inert>
        <div class="card">
          <h2 class="title small" id="pauseTitle">Paused</h2>
          <label class="option"><input type="checkbox" id="colorblindPause" /><span>Red–green colorblind mode</span></label>
          <div class="btn-col">
            <button class="btn primary" id="resumeBtn" type="button" data-autofocus>Resume <kbd>Space</kbd></button>
            <button class="btn" id="restartBtn" type="button">Restart <kbd>R</kbd></button>
            <button class="btn ghost" id="pauseMenuBtn" type="button">Main menu</button>
          </div>
        </div>
      </section>

      <!-- Game over -->
      <section class="overlay" id="overOverlay" aria-labelledby="overTitle" inert>
        <div class="card">
          <h2 class="title small" id="overTitle">Game Over</h2>
          <p class="subtitle" id="overReason"></p>

          <div class="final">
            <span class="final-score" id="finalScore">0</span>
            <span class="badge" id="newBest" hidden>★ New high score</span>
          </div>

          <dl class="summary">
            <div><dt>Best</dt><dd id="sumBest">0</dd></div>
            <div><dt>Length</dt><dd id="sumLength">0</dd></div>
            <div><dt>Food</dt><dd id="sumFood">0</dd></div>
            <div><dt>Time</dt><dd id="sumTime">0:00</dd></div>
          </dl>

          <div class="btn-col">
            <button class="btn primary" id="againBtn" type="button" data-autofocus>Play again <kbd>Enter</kbd></button>
            <button class="btn ghost" id="overMenuBtn" type="button">Change difficulty <kbd>Esc</kbd></button>
          </div>
        </div>
      </section>
    </div>

    <footer class="help">
      <span class="no-touch"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
      <span class="no-touch"><kbd>Space</kbd> pause</span>
      <span class="no-touch"><kbd>R</kbd> restart</span>
      <span class="no-touch"><kbd>M</kbd> mute</span>
      <span class="touch-only">Swipe on the board to steer</span>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
